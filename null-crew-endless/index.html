<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>NULL CREW · ENDLESS</title>
  <meta name="description" content="Pick a crew member. Run forever. Score until you die. Unofficial nulls fan game." />
  <meta name="theme-color" content="#07080f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="app">
    <p class="badge">unofficial fan game · not affiliated with nullsxyz</p>
    <div class="frame">
      <canvas id="c" width="390" height="640" aria-label="NULL CREW endless game"></canvas>
      <div id="touch" class="touch" aria-hidden="true">
        <button type="button" id="btn-left" class="pad">◀</button>
        <button type="button" id="btn-jump" class="pad jump">JUMP</button>
        <button type="button" id="btn-right" class="pad">▶</button>
      </div>
    </div>
    <p class="hint">desktop: ← → / A D · space jump · mobile: buttons</p>
    <p class="credit">
      crew inspired by community art · tag
      <a href="https://x.com/nullsxyz" target="_blank" rel="noopener noreferrer">@nullsxyz</a>
    </p>
  </main>
  <script src="game.js"></script>
</body>
</html>
